name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: car_rental, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d car_rental" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - uses: actions/cache@v4
        with: { path: ~/.nuget/packages, key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}, restore-keys: nuget-${{ runner.os }}- }
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build --logger "trx;LogFileName=test-results.trx"
      - run: docker build -t vehicle-rental-api:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: "**/TestResults/*.trx", if-no-files-found: ignore }
