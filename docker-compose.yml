services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: car_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RentalDatabase: Host=db;Port=5432;Database=car_rental;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
      Brevo__ApiKey: ${BREVO_API_KEY:-replace-with-brevo-api-key}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL:-noreply@your-domain.example}
      Brevo__SenderName: ${BREVO_SENDER_NAME:-Vehicle Rental}
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
