services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: car_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RentalDatabase: Host=db;Port=5432;Database=car_rental;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
      Brevo__ApiKey: ${BREVO_API_KEY:-replace-with-brevo-api-key}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL:-noreply@your-domain.example}
      Brevo__SenderName: ${BREVO_SENDER_NAME:-Vehicle Rental}
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reverse proxy HTTPS/HTTP đứng trước api. Cấu hình site nằm trong ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Giữ chứng chỉ ACME và cấu hình sinh ra giữa các lần khởi động lại container.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      # Chỉ đổi giá trị này là đổi tên miền Caddy phục vụ; xem ./Caddyfile.
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
